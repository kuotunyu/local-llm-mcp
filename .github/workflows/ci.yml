name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        # --frozen: install exactly what uv.lock pins, so CI and local runs
        # resolve the same dependency versions instead of drifting apart.
        run: uv sync --frozen
      - name: Run tests
        # Protocol/auth E2E tests initialize real stdio + Streamable HTTP MCP
        # sessions without Ollama. Only model-backed calls self-skip when
        # localhost:11434 is unavailable.
        run: uv run pytest -q

  package:
    name: Build and install wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: uv build
      - name: Install wheel into clean environment
        run: |
          uv venv .release-smoke --python 3.12
          uv pip install --python .release-smoke/bin/python dist/*.whl
          .release-smoke/bin/python -c "import local_llm_mcp; print(local_llm_mcp.__version__)"
          .release-smoke/bin/local-llm-mcp --help
