name: Publish v0.2.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0.2.0.yml"

permissions:
  contents: write

jobs:
  publish:
    name: Validate and publish v0.2.0
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out publisher commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve and validate release commit
        id: release
        shell: bash
        run: |
          set -euo pipefail
          release_commit="$(git rev-parse "${GITHUB_SHA}^")"
          echo "commit=$release_commit" >> "$GITHUB_OUTPUT"

          git show "$release_commit:pyproject.toml" | grep -F 'version = "0.2.0"'
          git show "$release_commit:src/local_llm_mcp/__init__.py" | grep -F '__version__ = "0.2.0"'
          git show "$release_commit:manifest.json" | grep -F '"version": "0.2.0"'
          git show "$release_commit:uv.lock" | grep -A3 -F 'name = "local-llm-mcp"' | grep -F 'version = "0.2.0"'

      - name: Refuse to overwrite existing tag or release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse -q --verify refs/tags/v0.2.0 >/dev/null; then
            echo 'v0.2.0 tag already exists; refusing to overwrite.' >&2
            exit 1
          fi
          if gh release view v0.2.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v0.2.0 release already exists; refusing to overwrite.' >&2
            exit 1
          fi

      - name: Create annotated v0.2.0 tag at release commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.2.0 "${{ steps.release.outputs.commit }}" -m "local-llm-mcp v0.2.0 — Protocol, Security & Release Closure"
          git push origin refs/tags/v0.2.0

      - name: Write release notes
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          ## Overview

          First formal GitHub Release for `local-llm-mcp`, closing the protocol, trust-boundary, and packaging work already validated on `main`.

          ## What is verified

          - stdio and Streamable HTTP MCP initialization
          - protocol discovery of 7 Tools, 1 Resource, and 2 Prompts without requiring Ollama
          - missing/invalid HTTP Bearer authentication is rejected
          - real Ollama-backed tool calls remain separate opt-in integration tests
          - Python 3.11 and 3.12 CI
          - reproducible `uv sync --frozen`
          - source distribution / wheel build
          - clean wheel install and CLI/import smoke

          ## Trust boundaries

          - stdio relies on process-level trust
          - Streamable HTTP uses the MCP SDK TokenVerifier/AuthSettings path with a pre-shared Bearer key
          - private tools call the configured Ollama endpoint; the default endpoint is loopback-local
          - changing `OLLAMA_HOST` to a remote endpoint changes that privacy boundary
          - `web_search` is the explicit opt-in external path and sends its query to the configured Felo API
          - model output is treated as data and is not automatically executed; this is a non-execution boundary, not a claim that prompt injection is universally solved

          ## Scope

          No new MCP tools, model changes, benchmark reruns, OAuth/JWT infrastructure, or platform-stack expansion were added for this release.

          ## Compatibility evidence

          The repository documents previously verified real-client integrations with Claude Desktop, Claude Code, LM Studio, and Antigravity CLI.
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v0.2.0 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "local-llm-mcp v0.2.0 — Protocol, Security & Release Closure" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
