name: Refresh release lock

on:
  push:
    branches: [release/v0.2.0]
    paths:
      - ".github/workflows/refresh-release-lock.yml"
      - "pyproject.toml"
      - "src/local_llm_mcp/__init__.py"
      - "manifest.json"

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/v0.2.0
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Refresh uv.lock from release metadata
        run: uv lock
      - name: Verify frozen install
        run: uv sync --frozen
      - name: Commit lockfile if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already consistent"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: refresh uv.lock for v0.2.0"
          git push origin HEAD:release/v0.2.0
