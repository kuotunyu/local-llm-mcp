[project]
name = "local-llm-mcp"
version = "0.2.0"
description = "Local-first MCP server for Ollama-backed private tasks with an explicit opt-in cloud search boundary."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "kuotunyu", email = "61350295+kuotunyu@users.noreply.github.com" }]
dependencies = [
    "mcp[cli]>=1.28.1,<2.0",
    "ollama>=0.6.2",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/kuotunyu/local-llm-mcp"
Repository = "https://github.com/kuotunyu/local-llm-mcp"
Issues = "https://github.com/kuotunyu/local-llm-mcp/issues"
Release = "https://github.com/kuotunyu/local-llm-mcp/releases/tag/v0.2.0"

[project.scripts]
local-llm-mcp = "local_llm_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_llm_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
